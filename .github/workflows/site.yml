name: Daily update and publish

on:
  schedule:
    - cron: "0 3 * * *"   # 07:00 Dubai time, every day
  workflow_dispatch:
    inputs:
      add:
        description: "How many new names to add"
        default: "25"
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Read Google Trends (14 countries)
        if: github.event_name != 'push'
        run: python3 scripts/trends.py
        continue-on-error: true
      - name: Add new names, drop sold/taken ones
        if: github.event_name != 'push'
        run: python3 scripts/daily_update.py --add "${{ github.event.inputs.add || '25' }}" --recheck 60
      - name: Save today's changes
        if: github.event_name != 'push'
        run: |
          git config user.name "claimly-bot"
          git config user.email "claimly-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "No changes" || (git commit -m "Daily update $(date -u +%F)" && git push)
      - name: Build the site
        run: python3 scripts/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
        if: github.event_name != 'push'
        with:
          ref: main
      - name: Ping search engines about new pages (IndexNow)
        if: github.event_name != 'push'
        run: sleep 60 && python3 scripts/indexnow.py
